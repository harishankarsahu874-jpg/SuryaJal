# TEMPORARY - fetches raw reference data for the NIST campus layer (scripts/build_campus.py)
# from servers the development sandbox cannot reach, and commits it to scripts/campus_raw/
# on this branch. Remove this file once data/campus_nist.json is built.
name: campus-data (temporary)

on:
  push:
    branches: [arena/50616d2a-suryajal]
    paths: [".github/workflows/campus-data.yml"]

permissions:
  contents: write

concurrency:
  group: campus-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install requests

      - name: Official campus photos from nist.edu (for matching buildings to the imagery)
        continue-on-error: true
        run: |
          pip install pillow
          mkdir -p scripts/campus_raw/photos
          python - <<'EOF' 2>&1 | tee scripts/campus_raw/photos.log
          import io, requests
          from PIL import Image
          B = "https://www.nist.edu/nist/"
          files = {
              "lhc": "campus/images/lhc.webp", "galleria": "campus/images/galleraia_building.webp",
              "octagon": "campus/images/octagon.webp", "atrium": "campus/images/Atrium.webp",
              "tifac": "campus/images/tifac-building.webp", "core": "campus/images/Core%20Building.webp",
              "hostel_einstein": "campus/images/HR%201.webp", "hostel_tagore": "campus/images/HR%202.webp",
              "hostel_curie": "campus/images/hostel1.webp", "workshop": "campus/images/workshop.webp",
              "research_center": "campus/images/research-lab.webp", "entrepreneurship": "campus/images/compressed_DSC04750.webp",
              "student_facility": "campus/images/student-facility-center.webp", "transport": "campus/images/DSC02429.webp",
              "yoga": "campus/images/yoga-center.webp", "gym": "campus/images/gym.webp",
              "library": "images/student-life/Library.jpg", "atm": "campus/images/atm.webp",
              "swimming": "SportsCulture/images/swimming.jpg", "medical": "images/student-life/medical.jpg",
              "rock_garden": "campus/images/student-garden.webp", "slide7": "images/New/Slide-7.webp",
              "slide4": "images/New/Slide-4.webp", "slide13": "images/New/Slide-13.webp", "slide": "images/New/SLIDE.webp",
          }
          S = requests.Session(); S.headers["User-Agent"] = "Mozilla/5.0 SuryaJal-campus-probe/1.0"
          for name, path in files.items():
              try:
                  r = S.get(B + path, timeout=40); r.raise_for_status()
                  im = Image.open(io.BytesIO(r.content)).convert("RGB")
                  print(name, im.size, len(r.content))
                  im.thumbnail((1000, 1000))
                  im.save(f"scripts/campus_raw/photos/{name}.jpg", quality=82)
              except Exception as e:
                  print("ERR", name, e)
          EOF

      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/campus_raw
          git commit -m "campus: probe results for scripts/build_campus.py (temporary)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
