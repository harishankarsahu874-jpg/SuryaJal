# TEMPORARY - fetches the raw NIST campus data (Overture building outlines + places,
# OpenStreetMap, Esri imagery previews) that scripts/build_campus.py needs, because the
# development sandbox has no route to those servers. Commits the results to
# scripts/campus_raw/ on this branch. Remove this file once data/campus_nist.json is built.
name: campus-data (temporary)

on:
  push:
    branches: [arena/50616d2a-suryajal]
    paths: [".github/workflows/campus-data.yml"]

permissions:
  contents: write

concurrency:
  group: campus-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install "overturemaps==2.1.0" pillow requests

      - name: Fetch campus data
        run: python scripts/build_campus.py fetch 2>&1 | tee scripts/campus_raw.log
        continue-on-error: true

      - name: Render previews
        run: |
          mkdir -p scripts/campus_raw
          mv scripts/campus_raw.log scripts/campus_raw/fetch.log || true
          python scripts/build_campus.py preview 2>&1 | tee scripts/campus_raw/preview.log
        continue-on-error: true

      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/campus_raw
          git commit -m "campus: raw NIST data for scripts/build_campus.py (temporary)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
