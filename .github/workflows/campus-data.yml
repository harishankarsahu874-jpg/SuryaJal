# TEMPORARY - fetches raw reference data for the NIST campus layer (scripts/build_campus.py)
# from servers the development sandbox cannot reach, and commits it to scripts/campus_raw/
# on this branch. Remove this file once data/campus_nist.json is built.
name: campus-data (temporary)

on:
  push:
    branches: [arena/50616d2a-suryajal]
    paths: [".github/workflows/campus-data.yml"]

permissions:
  contents: write

concurrency:
  group: campus-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install requests

      - name: Probe named campus places (Google-listed places mirrored by onefivenine, Wikimapia)
        continue-on-error: true
        run: |
          mkdir -p scripts/campus_raw
          python - <<'EOF' 2>&1 | tee scripts/campus_raw/probe.log
          import html, json, re, time
          import requests
          S = requests.Session()
          S.headers["User-Agent"] = "Mozilla/5.0 (X11; Linux x86_64) SuryaJal-campus-probe/1.0"
          OUT = "scripts/campus_raw/"
          def get(url, **kw):
              for i in range(3):
                  try:
                      r = S.get(url, timeout=40, **kw)
                      return r
                  except Exception as e:
                      print("ERR", url, e); time.sleep(2)
              return None
          def text(s):
              return html.unescape(re.sub(r"<[^>]+>", " ", s)).replace("\xa0", " ")
          KEY = re.compile(r"nist|national institut|galleria|atrium|attrium|lhc|octagon|tifac|hall of residence|"
                           r"mech|hostel|canteen|gumti|sukudu|8 inn|core building|s\. ?m\. public", re.I)
          # 1) village pages around the campus -> place ids
          villages = ["https://www.onefivenine.com/india/villages/Ganjam/Chikiti/Palli",
                      "https://www.onefivenine.com/india/villages/Ganjam/Rangeilunda/Kotharsingi"]
          for idx in ("https://www.onefivenine.com/india/villag/Ganjam/Rangeilunda",
                      "https://www.onefivenine.com/india/villag/Ganjam/Chikiti"):
              r = get(idx)
              if r is not None and r.ok:
                  for href, name in re.findall(r'href="([^"]*/india/villages/Ganjam/[^"]+)"[^>]*>([^<]+)<', r.text):
                      if re.search(r"golanth|gobind|manik|khunta|palur|paluru|randha|mantrid|kothar|palli|bhalia|ghati|"
                                   r"chikarada|girisola|biswanath|sunadei|indrakhi|konisi|panchama|rangeilunda", name, re.I):
                          u = href if href.startswith("http") else "https://www.onefivenine.com" + href
                          if u not in villages:
                              villages.append(u)
          print("villages:", len(villages)); [print("  ", v) for v in villages]
          places = {}
          for v in villages:
              r = get(v)
              if r is None or not r.ok:
                  print("village fail", v); continue
              h = r.text
              for m in re.finditer(r"placeId=(\d+)", h):
                  pid = m.group(1)
                  back = text(h[max(0, m.start() - 900):m.start()])
                  back = re.sub(r"\s+", " ", back).strip()
                  name = back.split("distance")[0][-260:] if "distance" in back else back[-260:]
                  if KEY.search(name):
                      places.setdefault(pid, {"pid": pid, "ctx": name.strip(), "seen_on": []})["seen_on"].append(v.rsplit("/", 1)[-1])
              time.sleep(0.4)
          print("candidate places:", len(places))
          # 2) detail pages -> coordinates
          sample_saved = False
          for pid, p in places.items():
              r = get(f"https://www.onefivenine.com/listing.do?method=viewGGPlace&placeId={pid}")
              if r is None or not r.ok:
                  print("detail fail", pid); continue
              h = r.text
              if not sample_saved:
                  open(OUT + "probe_detail_sample.html", "w").write(h[:250000]); sample_saved = True
              t = re.search(r"<title>(.*?)</title>", h, re.S)
              p["title"] = re.sub(r"\s+", " ", html.unescape(t.group(1))).strip() if t else ""
              pairs = re.findall(r"(1[89]\.\d{3,})\s*[,;/ ]\s*(8[45]\.\d{3,})", h)
              lat = re.findall(r"lat\w*['\"]?\s*[:=]\s*['\"]?(1[89]\.\d+)", h, re.I)
              lng = re.findall(r"(?:lng|lon)\w*['\"]?\s*[:=]\s*['\"]?(8[45]\.\d+)", h, re.I)
              p["pairs"] = pairs[:6]; p["lat"] = lat[:4]; p["lng"] = lng[:4]
              if not (pairs or lat):
                  nums = re.findall(r"(?<![\d.])(1[89]\.\d{4,}|8[45]\.\d{4,})(?![\d])", h)
                  p["nums"] = nums[:10]
              print(pid, "|", p["title"], "|", pairs[:2], lat[:2], lng[:2], p.get("nums", "")[:4] if p.get("nums") else "")
              time.sleep(0.4)
          json.dump(list(places.values()), open(OUT + "probe_places.json", "w"), indent=1, ensure_ascii=False)
          # 3) Wikimapia (public example key) - user-drawn campus objects, if any
          for url in [
              "http://api.wikimapia.org/?key=example&function=place.getbyarea&coordsby=bbox&bbox=84.7385,19.1920,84.7550,19.2045&format=json&count=100&data_blocks=main,geometry,location&language=en",
              "http://api.wikimapia.org/?key=example&function=place.getnearest&lat=19.1982&lon=84.7466&format=json&count=50&data_blocks=main,geometry,location&language=en",
              "http://api.wikimapia.org/?key=example&function=place.search&q=NIST&lat=19.1982&lon=84.7466&format=json&count=50&data_blocks=main,geometry,location&language=en",
          ]:
              r = get(url)
              tag = url.split("function=")[1].split("&")[0]
              if r is not None:
                  print("wikimapia", tag, r.status_code, len(r.content))
                  open(OUT + f"wikimapia_{tag}.json", "w").write(r.text[:400000])
              time.sleep(1)
          EOF

      - name: Commit results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/campus_raw
          git commit -m "campus: probe results for scripts/build_campus.py (temporary)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
